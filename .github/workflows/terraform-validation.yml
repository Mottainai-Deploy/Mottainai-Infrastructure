name: Terraform validation

on:
  pull_request:
    paths:
      - 'infra/aws/**'
      - '.github/workflows/terraform-validation.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/**'
      - '.github/workflows/terraform-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.environment }} environment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [test, official]
    defaults:
      run:
        working-directory: infra/aws/environments/${{ matrix.environment }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws
        working-directory: .

      - name: Initialize without configuring a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate


